info:
  name: ingest-event
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/v1/events"
  headers:
    - name: x-api-key
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "type": "user.created",
        "payload": {
          "userId": "123",
          "email": "production@test.com"
        },
        "endpointId": "{{endpointId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
